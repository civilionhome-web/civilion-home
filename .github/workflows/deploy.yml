# Builds the app and publishes it on GitHub Pages every time you push to "main".
# One-time setup: Settings → Pages → Source: "GitHub Actions",
# and Settings → Secrets and variables → Actions → add the two secrets below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Repository variable (optional): whatsapp | sms | email. Defaults to email.
          VITE_CLIENT_LOGIN: ${{ vars.VITE_CLIENT_LOGIN || 'email' }}
          # "/" with a custom domain, "/<repo-name>/" otherwise — filled in automatically
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Let every page address open the app
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
